const keyOf=(d,g)=>{d=new Date(d);if(g=="Week"){const x=sod(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return"Wk "+x.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}if(g=="Month")return d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"});return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})};
const labs=(f,t,g)=>{const s=new Set;for(let d=sod(f);d<=t;d=new Date(+d+DAY))s.add(keyOf(d,g));return[...s]},agg=(L,g,rows,df,vf)=>{const m=Object.fromEntries(L.map(l=>[l,0]));rows.forEach(r=>{const d=df(r);if(d){const k=keyOf(d,g);if(k in m)m[k]+=vf(r)}});return L.map(l=>m[l])};
function bars(L,S,m){const W=680,H=190,pl=48,pb=26,n=L.length||1,mx=Math.max(1,...S.flatMap(s=>s.v)),gw=(W-pl)/n,bw=Math.max(3,gw*.7/S.length);let g="";for(let i=0;i<=4;i++){const y=H-pb-(H-pb-10)*i/4;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#DCE8E6"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#566B7C">${m?"₹"+Math.round(mx*i/4):Math.round(mx*i/4)}</text>`}L.forEach((l,i)=>{S.forEach((s,k)=>{const h=(H-pb-10)*s.v[i]/mx,x=pl+i*gw+(gw-bw*S.length)/2+k*bw;g+=`<rect x="${x}" y="${H-pb-h}" width="${bw}" height="${h}" rx="3" fill="${s.c}"><title>${l} · ${s.n}: ${m?money(s.v[i]):s.v[i]}</title></rect>`});if(n<=12||i%Math.ceil(n/10)==0)g+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#566B7C">${l}</text>`});return`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px" role="img">${g}</svg></div><div class="sm" style="margin-top:4px">Total: ${S.map(s=>`<span style="color:${s.c}">■</span> ${s.n} ${m?money(sum(s.v,x=>x)):sum(s.v,x=>x)}`).join(" · ")}</div>`}
const rank=(a,m)=>{const mx=Math.max(1,...a.map(x=>x.v));return a.length?`<div class="rk">${a.map(x=>`<div><span title="${esc(x.n)}">${esc(x.n.slice(0,16))}</span><i style="width:${Math.max(2,x.v/mx*100)}%"></i><b>${m?money(x.v):x.v}</b></div>`).join("")}</div>`:'<div class="empty">No data in this period.</div>'};
const rng=()=>{const t=V.gt?new Date(V.gt+"T00:00:00"):sod(now()),f=V.gf?new Date(V.gf+"T00:00:00"):new Date(+t-29*DAY);return{f,t:new Date(+t+DAY-1),fs:f.toISOString().slice(0,10),ts:t.toISOString().slice(0,10)}};
const rngH=(x,extra="")=>`<div class="bar"><div class="fg"><label for="gf">From</label><input id="gf" type="date" value="${x.fs}" onchange="V.gf=this.value;go(V.v)"></div><div class="fg"><label for="gt">To</label><input id="gt" type="date" value="${x.ts}" onchange="V.gt=this.value;go(V.v)"></div><div class="fg"><label for="gg">Group by</label><select id="gg" onchange="V.gg=this.value;go(V.v)">${["Day","Week","Month"].map(c=>`<option ${c==(V.gg||"Day")?"selected":""}>${c}</option>`).join("")}</select></div>${extra}</div>`;

const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{try{const m=1000,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);fin(c.toDataURL("image/jpeg",.82))}catch(_){fin(r.result)}};i.onerror=()=>{$("e_"+k).textContent="Could not read this image";IMG[k]=null};i.src=r.result};r.readAsDataURL(f)}

if(CK.lines.length){CK.step="pay";CK.pm="on";go("co")}else{V.pid=x.ids[0];V.ps=1;CK={};go("orders")}})}
